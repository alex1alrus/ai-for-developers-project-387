name: opencode

# Match the job filter here so even an admitted run cancelled before it reaches
# a runner leaves a budget entry. Filtered comments get a different title.
run-name: >-
  ${{ (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot' &&
      (github.event.pull_request.number || github.event.issue.pull_request) &&
      format('opencode: admitted PR #{0}', github.event.pull_request.number || github.event.issue.number) ||
      format('opencode: comment on #{0}', github.event.pull_request.number || github.event.issue.number) }}

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

env:
  PR_ATTEMPT_LIMIT: '3'
  PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
  OPENCODE_MODEL: opencode/gpt-6.2-sol
  OPENCODE_MENTIONS: /opencode,/oc

jobs:
  opencode:
    if: >-
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event.pull_request.number || github.event.issue.pull_request) && 35 || 30 }}
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      actions: read # budget history
      contents: read # checkout
      id-token: write # exchange for the opencode-agent GitHub App token
      issues: write # gh for agent skills (docs/agents/issue-tracker.md)
      pull-requests: read
    outputs:
      used: ${{ steps.budget.outputs.used }}
      reason: >-
        ${{ steps.budget.outputs.reason || steps.agent.outputs.reason ||
            ((steps.budget.outcome == 'failure' || steps.checkout.outcome == 'failure' ||
              steps.setup.outcome == 'failure') && 'infra') || '' }}
    steps:
      # Keep the gate in the agent job so Re-run failed jobs cannot reuse a
      # successful gate to start another agent attempt without checking again.
      - name: Check PR budget
        id: budget
        if: env.PR_NUMBER != ''
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: &check_budget |
          # First attempts reserve slots in request order, even if jobs start
          # out of order. A Re-run uses the history as it stands at the gate.
          # Count retries of other runs even when the original request is newer.
          total=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/opencode.yml/runs?per_page=100" |
            jq -ser --arg title "opencode: admitted PR #$PR_NUMBER" \
              --argjson id "$GITHUB_RUN_ID" --argjson number "$GITHUB_RUN_NUMBER" \
              --argjson attempt "$GITHUB_RUN_ATTEMPT" '
                [.[].workflow_runs[] | select(.display_title == $title)]
                | group_by(.id) | map(max_by(.run_attempt))
                | if any(.[]; .id == $id and .run_attempt == $attempt) then
                    $attempt + (map(select(.id != $id) |
                      if $attempt > 1 or .run_number < $number then .run_attempt
                      else .run_attempt - 1 end) | add // 0)
                  else error("Current workflow attempt is missing from Actions history") end
              ')
          if (( total > PR_ATTEMPT_LIMIT )); then
            echo "used=$PR_ATTEMPT_LIMIT" >> "$GITHUB_OUTPUT"
            echo 'reason=limit_exhausted' >> "$GITHUB_OUTPUT"
          else
            echo "used=$total" >> "$GITHUB_OUTPUT"
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        id: checkout
        if: env.PR_NUMBER == '' || steps.budget.outputs.allowed == 'true'
        timeout-minutes: ${{ env.PR_NUMBER == '' && 30 || 2 }}
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        if: env.PR_NUMBER == ''
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        with:
          model: ${{ env.OPENCODE_MODEL }}
          mentions: ${{ env.OPENCODE_MENTIONS }}
          share: false

      - name: Install OpenCode for PR
        id: setup
        if: steps.budget.outputs.allowed == 'true'
        timeout-minutes: 3
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --no-modify-path
          "$HOME/.opencode/bin/opencode" --version

      - name: Run OpenCode for PR
        id: agent
        if: steps.budget.outputs.allowed == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ env.OPENCODE_MODEL }}
          MENTIONS: ${{ env.OPENCODE_MENTIONS }}
          SHARE: 'false'
        shell: bash
        run: |
          if [[ -z "$OPENCODE_API_KEY" ]]; then
            echo 'reason=infra' >> "$GITHUB_OUTPUT"
            echo '::error::OPENCODE_API_KEY is missing'
            exit 1
          fi

          # Capture only the watchdog's diagnostics to distinguish its timeout
          # (including SIGKILL escalation) from a process returning 124 or 137.
          watchdog_log=$(mktemp)
          # shellcheck disable=SC2016
          trap 'rm -f "$watchdog_log"' EXIT
          status=0
          # shellcheck disable=SC2016
          LC_ALL=C timeout --verbose --kill-after=15s 25m \
            bash -c 'exec "$HOME/.opencode/bin/opencode" github run 2>&3 3>&-' \
            3>&2 2>"$watchdog_log" || status=$?
          if (( status != 0 )); then
            if grep -q '^timeout: sending signal TERM ' "$watchdog_log"; then
              echo 'reason=timeout' >> "$GITHUB_OUTPUT"
              echo '::error::OpenCode exceeded its 25-minute timeout'
            elif (( status == 125 || status == 126 || status == 127 )); then
              echo 'reason=infra' >> "$GITHUB_OUTPUT"
            else
              echo 'reason=agent_failed' >> "$GITHUB_OUTPUT"
            fi
            cat "$watchdog_log" >&2
            exit "$status"
          fi

  report:
    needs: opencode
    if: >-
      always() && (github.event.pull_request.number || github.event.issue.pull_request) &&
      (needs.opencode.outputs.reason != '' ||
       needs.opencode.result == 'failure' || needs.opencode.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Recover PR attempt count if the gate did not finish
        id: budget
        if: needs.opencode.outputs.used == ''
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: *check_budget

      - name: Post stop reason on PR
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: >-
            ${{ needs.opencode.outputs.reason || steps.budget.outputs.reason ||
                (needs.opencode.result == 'cancelled' && 'cancelled') || 'unknown' }}
          USED: ${{ needs.opencode.outputs.used || steps.budget.outputs.used }}
        shell: bash
        run: |
          case "$REASON" in
            limit_exhausted) detail='Бюджет исчерпан; модель не вызывалась.' ;;
            timeout) detail='Вызов OpenCode превысил тайм-аут.' ;;
            infra) detail='Не удалось подготовить запуск OpenCode.' ;;
            agent_failed) detail='OpenCode завершился с ошибкой.' ;;
            cancelled) detail='Задание OpenCode отменено. Проверьте логи прогона.' ;;
            *) REASON=unknown; detail='Причину нужно проверить по логам.' ;;
          esac
          if [[ ! "$USED" =~ ^[0-9]+$ ]]; then
            USED='не удалось определить'
          fi

          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha' || true)
          if [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            head="\`$head\`"
          else
            head='не удалось получить через GitHub API'
          fi
          logs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"

          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$(
            printf "OpenCode остановлен: \`%s\`. %s\n\n" "$REASON" "$detail"
            printf -- '- Статус: **нужен человек**\n- Последний head SHA PR: %s\n' "$head"
            printf -- '- Использовано попыток: %s из %s\n- [Логи прогона](%s)\n' "$USED" "$PR_ATTEMPT_LIMIT" "$logs"
          )"
