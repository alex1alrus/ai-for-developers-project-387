name: triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      github.event.issue.user.type == 'User' &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Share the group with opencode.yml so manual and automatic triage do not overlap.
      group: opencode-${{ github.event.issue.number }}
      cancel-in-progress: false
    # GITHUB_TOKEN instead of the opencode-agent App token (#22): with `contents: read` and
    # `pull-requests: read` the agent cannot push or open PRs. `issues: write` still allows
    # closing or editing issues; keeping to labels and comments there rests on the prompt.
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          # Edits are denied to keep the tree clean; the hard limit is the token above (no push).
          # The model is declared so a fresh runner without the models.dev cache still finds it.
          OPENCODE_CONFIG_CONTENT: '{"provider":{"opencode":{"models":{"gpt-6.2-sol":{"name":"GPT 6.2 Sol"}}}},"permission":{"edit":"deny"}}'
        with:
          model: opencode/gpt-6.2-sol
          use_github_token: true
          share: false
          prompt: |
            Выполни первичный триаж только что открытого issue #${{ github.event.issue.number }}
            (`gh issue view ${{ github.event.issue.number }} --json number,title,body,labels,comments`)
            по скиллу triage
            (`.claude/skills/triage/SKILL.md`). Сверь обращение с тем, как уже работает
            приложение, и учти его правила, ограничения и принятые решения.
            Поставь метки категории и состояния по правилам скилла и
            `docs/agents/triage-labels.md`. Если данных не хватает, поставь `needs-info`
            и задай автору конкретные вопросы в комментарии. Если нужно решение
            мейнтейнера, оставь `needs-triage` и опиши, что нужно решить.
            Работай только с метками и комментариями этого issue. Не меняй файлы
            репозитория, не реализуй задачу и не создавай коммиты или PR.
