name: PR check

# Squash merge takes the PR title as the commit subject on main, and release-please
# reads it. This check makes the format and the template enforced, not only asked for
# in AGENTS.md. No secrets, no checkout: title and body come from the event payload.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check title and template sections
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: python3 {0}
        run: |
          import os, re, sys

          errors = []
          title = os.environ['TITLE']
          if not re.fullmatch(r'(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([\w./-]+\))?!?: \S.*', title):
              errors.append(f'Заголовок не по Conventional Commits: "{title}". Пример: "feat: cancel a booking (#10)".')

          # release-please writes its own body; its title is still checked. Only its own PRs
          # (branch prefix and the github-actions bot as author) skip the body check.
          release = os.environ['HEAD_REF'].startswith('release-please--') and os.environ['AUTHOR'] == 'github-actions[bot]'
          if not release:
              body = os.environ['BODY'] or ''
              # Headings and Closes lines inside fenced code blocks are examples, not sections;
              # the block itself still fills its section (command output in «Проверки»). A block
              # closes only on a line of the same fence (``` or ~~~, at least as long), so an inner
              # fence of a ```` block stays inside it. Fences go first, so `<!--` in code is code.
              body = re.sub(r'^(?:(`{3,})(?!`)[^\n`]*|(~{3,})(?!~)[^\n]*)\n.*?^(?(1)\1`*|\2~*)[ \t\r]*$', '[code]', body, flags=re.S | re.M)
              # HTML comments are hidden by GitHub. One that starts a line may span lines, and if
              # it is never closed it hides the rest of the body; inside a line only a comment
              # closed on the same line is hidden, a stray `<!--` there is plain text.
              body = re.sub(r'^[ \t]*<!--.*?(?:-->|\Z)', '', body, flags=re.S | re.M)
              body = re.sub(r'<!--[^\n]*?-->', '', body)
              parts = re.split(r'^## +(.+?)\s*$', body, flags=re.M)
              sections = {name: text.strip() for name, text in zip(parts[1::2], parts[2::2])}
              template = ['Исходное обращение', 'Спецификация', 'Тикеты', 'Согласование человеком',
                          'Проверки', 'Риск', 'Откат']
              for name in template:
                  if not sections.get(name):
                      errors.append(f'Раздел «{name}» из .github/pull_request_template.md отсутствует или пуст.')
              if not re.search(r'(?im)^\s*[-*]?\s*(closes|fixes|resolves) #\d+\b', sections.get('Тикеты', '')):
                  errors.append('В разделе «Тикеты» нет отдельной строки "Closes #N" для закрываемой задачи.')

          for error in errors:
              print(f'::error::{error}')
          sys.exit(1 if errors else 0)
