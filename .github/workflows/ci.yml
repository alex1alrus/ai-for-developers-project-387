name: CI

# PRs get `check` from `pull_request`. The release-please PR comes from GITHUB_TOKEN, so its
# `push` starts nothing, but its `pull_request` runs start once a human approves them on the PR.
# `push` to main checks the squash commit.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # `mise install` (in mise-action) runs `setup`, which installs Chromium; CI also needs its system libraries.
      - run: mise exec -- npx playwright install --with-deps chromium
      - run: mise run check
