name: opencode

# Interactive agent: a trusted collaborator calls it with /oc or /opencode
# in an issue / PR discussion or on a line of a PR diff.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Run only for a command from a trusted human. Forks and outsiders never reach the model key.
    if: >-
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read # checkout
      id-token: write # OIDC exchange for the opencode-agent GitHub App token; the agent comments and pushes as the App
      issues: write # GH_TOKEN below: triage, to-spec and to-tickets label and create issues with gh (docs/agents/issue-tracker.md)
      pull-requests: read # GH_TOKEN reads PRs with gh; PRs are opened by the App
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Token for gh in the agent's shell (the App token is not exposed to it): issues only, read-only code and PRs.
          GH_TOKEN: ${{ github.token }}
        with:
          model: opencode/gpt-6.2-sol
          mentions: /opencode,/oc
          share: false
