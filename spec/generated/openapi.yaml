openapi: 3.1.0
info:
  title: Call booking API
  version: 0.0.0
tags:
  - name: EventTypes
  - name: Bookings
paths:
  /api/bookings:
    get:
      operationId: listBookings
      description: Upcoming bookings (`end > now`, ongoing included) of all event types sorted by start.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
      tags:
        - Bookings
    post:
      operationId: createBooking
      description: Books a free slot; no overlap with any booking of any event type.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
  /api/event-types:
    get:
      operationId: listEventTypes
      description: All event types sorted by title.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
      tags:
        - EventTypes
    post:
      operationId: createEventType
      description: Creates an event type; `id` must be unused.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - EventTypes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventType'
  /api/event-types/{id}/slots:
    get:
      operationId: listSlots
      description: |-
        Free slots of the booking window sorted by start.
        The service time zone is UTC. The booking window is 14 UTC dates: today (UTC) and the next 13 days.
        Working hours are 09:00–18:00 UTC every day. Slot starts follow a 30-minute grid from 09:00,
        a slot lasts the event type's duration and ends no later than 18:00. Past slots are not listed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - EventTypes
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
          description: English text for developers; the UI builds user text from `code`.
    ApiErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - INVALID_START
        - EVENT_TYPE_NOT_FOUND
        - EVENT_TYPE_EXISTS
        - BOOKING_CONFLICT
        - NOT_FOUND
    Booking:
      type: object
      required:
        - id
        - eventTypeId
        - start
        - guestName
        - guestEmail
        - end
      properties:
        id:
          type: string
          format: uuid
        eventTypeId:
          type: string
        start:
          type: string
          format: date-time
          description: Must be a start of a slot of the event type.
        guestName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^\S(.*\S)?$
          description: No surrounding whitespace, no line breaks.
        guestEmail:
          type: string
          maxLength: 254
          pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
        end:
          type: string
          format: date-time
          description: "`start` plus the event type's duration."
      description: An interval `[start, end)` a guest took for an event type.
    BookingRequest:
      type: object
      required:
        - eventTypeId
        - start
        - guestName
        - guestEmail
      properties:
        eventTypeId:
          type: string
        start:
          type: string
          format: date-time
          description: Must be a start of a slot of the event type.
        guestName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^\S(.*\S)?$
          description: No surrounding whitespace, no line breaks.
        guestEmail:
          type: string
          maxLength: 254
          pattern: ^[^\s@]+@[^\s@]+\.[^\s@]+$
      description: What a guest sends to book a slot.
    EventType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          maxLength: 64
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: Short identifier set by the owner, used in URLs.
        title:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^\S(.*\S)?$
          description: No surrounding whitespace, no line breaks.
        description:
          type: string
          maxLength: 500
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 540
          description: Multiple of 15, from 15 to 540.
          multipleOf: 15
      description: A call format the owner offers.
    Slot:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      description: A free interval `[start, end)` of an event type's duration; computed, not stored.
